<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#111817" />
    <meta name="description" content="Kirana turns any online shop into something an AI assistant can search, price and pay for — without the shop writing a line of code." />
    <title>Kirana — make any merchant AI-buyable</title>

    <!-- Fonts are fetched before the stylesheet asks for them, and the page is
         readable in the fallback stack while they arrive. Geist does every job here:
         headlines at 600 with tight tracking, dense data at 400-500, and the mono only ever
         for things that are genuinely addresses or identifiers. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
