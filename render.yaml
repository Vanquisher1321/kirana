# Render blueprint — https://render.com/docs/blueprint-spec
#
# One free web service. No database service and no disk, deliberately:
# Render's free tier offers no persistent disk, and moving this project to
# Postgres would mean making every database call async across every module —
# a large refactor to satisfy a demo host. Instead the server re-seeds a demo
# shop whenever it boots into an empty database, so the public link is always
# live. Orders placed by a visitor are lost when the instance sleeps (15
# minutes idle, ~1 minute to wake). That trade is stated in the README.

services:
  - type: web
    name: kirana
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build:deploy
    startCommand: npm --prefix server run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      # A public sandbox anyone can drive: no login, Razorpay TEST credentials
      # only, and the server refuses to start on a live key. Set this to
      # "locked" for a real deployment.
      - key: KIRANA_ACCESS
        value: demo
      - key: KIRANA_DB
        value: /tmp/kirana.db
      # Generated by Render, never typed by a human and never equal to the
      # local development values. Two secrets that nobody has to handle are two
      # secrets that cannot be pasted into the wrong window.
      - key: KIRANA_CONSOLE_TOKEN
        generateValue: true
      - key: KIRANA_SIGNING_SECRET
        generateValue: true
      # Set these in the Render dashboard, never in this file.
      # RAZORPAY_KEY_ID must start with rzp_test_ — the server refuses to boot
      # on a live key, which is the point.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Leave BLANK on the first deploy: the hostname does not exist until the
      # service does. Set it to the URL Render gives you and redeploy —
      # it is what every buyer agent receives as its MCP endpoint.
      - key: PUBLIC_ORIGIN
        sync: false
